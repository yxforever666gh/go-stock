        netCashFlow: {type: number}
    Research2RecommendationDetail:
      type: object
      required: [recommendation, analysis, trades]
      properties:
        recommendation: {$ref: "#/components/schemas/Research2Recommendation"}
        analysis: {$ref: "#/components/schemas/Research2AnalysisRun"}
        trades: {type: array, items: {$ref: "#/components/schemas/Research2Trade"}}
    Research2AccountOverview:
      type: object
      required: [initialCash, cash, positionValue, netAssetValue, netProfit, returnRate, openPositions, pendingBuys, lastValuedAt]
      properties:
        initialCash: {type: number, const: 12000}
        cash: {type: number}
        positionValue: {type: number}
        netAssetValue: {type: number}
        netProfit: {type: number}
        returnRate: {type: number}
        openPositions: {type: integer, format: int64}
        pendingBuys: {type: integer, format: int64}
        lastValuedAt: {type: string, format: date-time}
    Research2AccountSnapshot:
      type: object
      required: [snapshotId, valuedAt, tradingDate, snapshotType, cash, positionValue, netAssetValue, netProfit, returnRate]
      properties:
        snapshotId: {type: string}
        valuedAt: {type: string, format: date-time}
        tradingDate: {type: string, format: date}
        snapshotType: {type: string}
        cash: {type: number}
        positionValue: {type: number}
        netAssetValue: {type: number}
        netProfit: {type: number}
        returnRate: {type: number}
    Research2Performance:
      allOf:
        - {$ref: "#/components/schemas/Research2AccountOverview"}
        - type: object
          required: [closedTrades, winningTrades, totalFees, hitFiveCount, hitLimitUpCount, hitMinusThreeCount, onTimeReports, lateReports, curve]
          properties:
            closedTrades: {type: integer, format: int64}
            winningTrades: {type: integer, format: int64}
            winRate: {type: number, nullable: true}
            totalFees: {type: number}
            maxDrawdown: {type: number, nullable: true}
            hitFiveCount: {type: integer, format: int64}
            hitLimitUpCount: {type: integer, format: int64}
            hitMinusThreeCount: {type: integer, format: int64}
            onTimeReports: {type: integer, format: int64}
            lateReports: {type: integer, format: int64}
            curve: {type: array, items: {$ref: "#/components/schemas/Research2AccountSnapshot"}}
