openapi: 3.1.0
info:
  title: Go-Stock Local Web API
  version: 1.7.8
  description: Local-only Web API for market data, watchlists, funds, settings, and AI research.
servers:
  - url: http://127.0.0.1:34115
paths:
  /livez:
    get:
      operationId: getLiveness
      responses:
        "200": {description: Process is alive, content: {application/json: {schema: {$ref: "#/components/schemas/LivenessStatus"}}}}
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200": {description: Ready, content: {application/json: {schema: {$ref: "#/components/schemas/SystemVersionStatus"}}}}
        "503": {description: Not ready, content: {application/json: {schema: {$ref: "#/components/schemas/SystemVersionStatus"}}}}
  /api/v1/system/info:
    get: {operationId: getSystemInfo, responses: {"200": {description: Display version information}}}
  /api/v1/system/update-check:
    post:
      operationId: checkForUpdates
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateCheckRequest"}}}}
      responses: {"202": {description: Update check accepted, content: {application/json: {schema: {$ref: "#/components/schemas/AcceptedResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/system/shutdown:
    post:
      operationId: shutdownSystem
      responses: {"200": {description: Shutdown requested, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "403": {$ref: "#/components/responses/Forbidden"}}
  /api/v1/settings:
    get: {operationId: getSettings, responses: {"200": {description: Settings}}}
    put:
      operationId: updateSettings
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/JsonObject"}}}}
      responses: {"200": {description: Settings updated, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/ai/configs:
    get: {operationId: listAIConfigs, responses: {"200": {description: AI configurations}}}
  /api/v1/ai/configs/test:
    post:
      operationId: testAIConfig
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AIConfigTestRequest"}}}}
      responses: {"200": {description: AI configuration test result}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/groups:
    get: {operationId: listGroups, responses: {"200": {description: Groups}}}
    post:
      operationId: createGroup
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/JsonObject"}}}}
      responses: {"200": {description: Group created, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/groups/initialize-sort:
    post: {operationId: initializeGroupSort, responses: {"200": {description: Group sort initialized}}}
  /api/v1/groups/{id}:
    delete: {operationId: deleteGroup, responses: {"200": {description: Group deleted}}}
  /api/v1/groups/{id}/sort:
    put:
      operationId: updateGroupSort
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/GroupSortRequest"}}}}
      responses: {"200": {description: Group sort updated, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/groups/{id}/stocks:
    post:
      operationId: addGroupStock
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StockCodeRequest"}}}}
      responses: {"200": {description: Stock added to group, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/groups/{id}/stocks/{code}:
    delete: {operationId: removeGroupStock, responses: {"200": {description: Stock removed from group}}}
  /api/v1/stocks/search:
    get: {operationId: searchStockMaster, responses: {"200": {description: Stock master search}}}
  /api/v1/stocks/query:
    post:
      operationId: queryStocks
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StockQueryRequest"}}}}
      responses: {"200": {description: Indicator stock query}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/stocks/{code}/snapshot:
    get: {operationId: getStockSnapshot, responses: {"200": {description: Stock snapshot}}}
  /api/v1/stocks/{code}/kline:
    get: {operationId: getStockKLine, responses: {"200": {description: Stock daily bars}}}
  /api/v1/stocks/{code}/minute-line:
    get: {operationId: getStockMinuteLine, responses: {"200": {description: Stock minute line}}}
  /api/v1/watchlist/stocks:
    get: {operationId: listFollowedStocks, responses: {"200": {description: Followed stocks}}}
    post:
      operationId: followStock
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StockCodeRequest"}}}}
      responses: {"200": {description: Stock followed, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/watchlist/stocks/{code}:
    delete: {operationId: unfollowStock, responses: {"200": {description: Stock unfollowed}}}
  /api/v1/watchlist/stocks/{code}/position:
    put:
      operationId: updateStockPosition
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StockPositionRequest"}}}}
      responses: {"200": {description: Position updated, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/watchlist/stocks/{code}/alarm:
    put:
      operationId: updateStockAlarm
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StockAlarmRequest"}}}}
      responses: {"200": {description: Alarm updated, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/watchlist/stocks/{code}/sort:
    put:
      operationId: updateStockSort
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/StockSortRequest"}}}}
      responses: {"200": {description: Sort updated, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/funds/search:
    get: {operationId: searchFunds, responses: {"200": {description: Fund search}}}
  /api/v1/watchlist/funds:
    get: {operationId: listFollowedFunds, responses: {"200": {description: Followed funds}}}
    post:
      operationId: followFund
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/FundCodeRequest"}}}}
      responses: {"200": {description: Fund followed, content: {application/json: {schema: {$ref: "#/components/schemas/CommandResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/watchlist/funds/{code}:
    delete: {operationId: unfollowFund, responses: {"200": {description: Fund unfollowed}}}
  /api/v1/market/telegraphs:
    get: {operationId: listTelegraphs, responses: {"200": {description: Telegraphs}}}
  /api/v1/market/telegraphs/refresh:
    post:
      operationId: refreshTelegraphs
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/TelegraphRefreshRequest"}}}}
      responses: {"200": {description: Telegraphs refreshed}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/market/indexes/global:
    get: {operationId: getGlobalIndexes, responses: {"200": {description: Global indexes}}}
  /api/v1/market/industries/rank:
    get: {operationId: getIndustryRank, responses: {"200": {description: Industry rank}}}
  /api/v1/market/industries/money-rank:
    get: {operationId: getIndustryMoneyRank, responses: {"200": {description: Industry money rank}}}
  /api/v1/market/stocks/money-rank:
    get: {operationId: getStockMoneyRank, responses: {"200": {description: Stock money rank}}}
  /api/v1/market/stocks/{code}/money-trend:
    get: {operationId: getStockMoneyTrend, responses: {"200": {description: Stock money trend}}}
  /api/v1/market/long-tiger:
    get: {operationId: getLongTigerRank, responses: {"200": {description: Long tiger rank}}}
  /api/v1/market/stocks/research-reports:
    get: {operationId: listStockResearchReports, responses: {"200": {description: All recent stock research reports}}}
  /api/v1/market/stocks/{code}/research-reports:
    get: {operationId: getStockResearchReports, responses: {"200": {description: Stock research reports}}}
  /api/v1/market/stocks/notices:
    get: {operationId: listStockNotices, responses: {"200": {description: All recent stock notices}}}
  /api/v1/market/stocks/{code}/notices:
    get: {operationId: getStockNotices, responses: {"200": {description: Stock notices}}}
  /api/v1/market/industries/research-reports:
    get: {operationId: listIndustryResearchReports, responses: {"200": {description: All recent industry research reports}}}
  /api/v1/market/industries/{code}/research-reports:
    get: {operationId: getIndustryResearchReports, responses: {"200": {description: Industry research reports}}}
  /api/v1/market/dictionary:
    get: {operationId: getMarketDictionary, responses: {"200": {description: Market dictionary}}}
  /api/v1/market/sentiment/weighted:
    post:
      operationId: analyzeWeightedSentiment
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SentimentRequest"}}}}
      responses: {"200": {description: Weighted sentiment}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/market/hot/stocks:
    get: {operationId: listHotStocks, responses: {"200": {description: Hot stocks}}}
  /api/v1/market/hot/events:
    get: {operationId: listHotEvents, responses: {"200": {description: Hot events}}}
  /api/v1/market/hot/topics:
    get: {operationId: listHotTopics, responses: {"200": {description: Hot topics}}}
  /api/v1/market/calendars/investment:
    get: {operationId: getInvestmentCalendar, responses: {"200": {description: Investment calendar}}}
  /api/v1/market/calendars/cls:
    get: {operationId: getCLSCalendar, responses: {"200": {description: CLS calendar}}}
  /api/v1/research/analysis-runs:
    get:
      operationId: listAnalysisRuns
      responses:
        "200": {description: Analysis runs, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AnalysisRunSummary"}}}}}
    post:
      operationId: startAnalysisRun
      responses: {"202": {description: Analysis accepted, content: {application/json: {schema: {$ref: "#/components/schemas/AcceptedResponse"}}}}, "409": {description: Analysis already running, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}}
  /api/v1/research/analysis-runs/{id}:
    get:
      operationId: getAnalysisRun
      responses:
        "200": {description: Analysis run, content: {application/json: {schema: {$ref: "#/components/schemas/AnalysisRun"}}}}
  /api/v1/research/recommendations:
    get:
      operationId: listRecommendations
      responses:
        "200": {description: Recommendations, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Recommendation"}}}}}
  /api/v1/research/recommendations/{id}:
    get:
      operationId: getRecommendation
      responses:
        "200": {description: Recommendation detail, content: {application/json: {schema: {$ref: "#/components/schemas/RecommendationDetail"}}}}
  /api/v1/research/recommendations/{id}/chart:
    get:
      operationId: getRecommendationChart
      description: Reads the persisted unadjusted minute cache and never calls an upstream provider.
      responses:
        "200": {description: Cached professional chart data, content: {application/json: {schema: {$ref: "#/components/schemas/RecommendationChart"}}}}
  /api/v1/research/recommendations/{id}/chart/refresh:
    post:
      operationId: refreshRecommendationChart
      description: Fills missing minute coverage using only enabled providers, refreshes the quote, and returns the chart data.
      responses:
        "200": {description: Refreshed professional chart data, content: {application/json: {schema: {$ref: "#/components/schemas/RecommendationChart"}}}}
        "409": {description: The same recommendation is already being refreshed, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}}
  /api/v1/research/account:
    get:
      operationId: getSimulatedAccount
      responses:
        "200": {description: Simulated account and net yield, content: {application/json: {schema: {$ref: "#/components/schemas/AccountOverview"}}}}
  /api/v1/research/account/cash-flows:
    get:
      operationId: listAccountCashFlows
      description: Lists external simulated-account contributions; trading cash flows are excluded.
      responses:
        "200": {description: Account contribution ledger, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/AccountCashFlow"}}}}}
  /api/v1/research/account/performance:
    get:
      operationId: getAccountPerformance
      description: Returns unitized TWR, valuation points and strategy-quality metrics.
      responses:
        "200": {description: Account performance, content: {application/json: {schema: {$ref: "#/components/schemas/AccountPerformance"}}}}
  /api/v1/exports/config:
    post:
      operationId: exportConfig
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ExportRequest"}}}}
      responses: {"200": {description: Export, content: {application/json: {schema: {$ref: "#/components/schemas/ExportResponse"}}}}, "400": {$ref: "#/components/responses/BadRequest"}}
  /api/v1/events/ws:
    get:
      operationId: connectEventsWebSocket
      responses: {"101": {description: Event stream}}
components:
  responses:
    BadRequest:
      description: Invalid JSON request or parameters
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Request is not from the bound loopback origin
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    JsonObject:
      type: object
      description: Provider- or configuration-defined JSON object whose stable fields are not owned by this transport layer.
    ErrorResponse:
      type: object
      required: [error]
      properties: {error: {type: string}}
    CommandResponse:
      type: object
      required: [ok]
      properties: {ok: {type: boolean}, message: {type: string}}
    AcceptedResponse:
      type: object
      required: [accepted]
      properties: {accepted: {type: boolean}}
    UpdateCheckRequest:
      type: object
      required: [flag]
      properties: {flag: {type: integer}}
    AIConfigTestRequest:
      type: object
      required: [id]
      properties: {id: {type: integer}}
    GroupSortRequest:
      type: object
      required: [sort]
      properties: {sort: {type: integer}}
    StockCodeRequest:
      type: object
      required: [stockCode]
      properties: {stockCode: {type: string}}
    StockQueryRequest:
      type: object
      required: [words]
      properties: {words: {type: string}}
    StockPositionRequest:
      type: object
      required: [price, volume]
      properties: {price: {type: number}, volume: {type: integer, format: int64}}
    StockAlarmRequest:
      type: object
      required: [value, alarmPrice]
      properties: {value: {type: number}, alarmPrice: {type: number}}
    StockSortRequest:
      type: object
      required: [sort]
      properties: {sort: {type: integer, format: int64}}
    FundCodeRequest:
      type: object
      required: [fundCode]
      properties: {fundCode: {type: string}}
    TelegraphRefreshRequest:
      type: object
      required: [source]
      properties: {source: {type: string}}
    SentimentRequest:
      type: object
      required: [text]
      properties: {text: {type: string}}
    ExportRequest:
      type: object
      properties: {mode: {type: string, enum: [download, server]}}
    ExportResponse:
      type: object
      required: [mode, filename]
      properties:
        mode: {type: string, enum: [download, server]}
        filename: {type: string}
        mime: {type: string}
        contentBase64: {type: string}
        path: {type: string}
    LivenessStatus:
      type: object
      required: [ok]
      properties: {ok: {type: boolean}}
    ReadinessStatus:
      type: object
      required: [migrations, database, services, scheduler, ready]
      properties:
        migrations: {type: boolean}
        database: {type: boolean}
        services: {type: boolean}
        scheduler: {type: boolean}
        ready: {type: boolean}
        error: {type: string}
    SystemVersionStatus:
      type: object
      required: [appVersion, mainSchemaVersion, minuteSchemaVersion, readiness]
      properties:
        appVersion: {type: string}
        commit: {type: string}
        buildTime: {type: string}
        artifactSHA256: {type: string}
        dirty: {type: boolean}
        mainSchemaVersion: {type: integer}
        minuteSchemaVersion: {type: integer}
        startedAt: {type: string, format: date-time}
        readiness: {$ref: "#/components/schemas/ReadinessStatus"}
    AnalysisRun:
      type: object
      required: [runId, status, startedAt, finalReport, recommendationCount]
      properties:
        runId: {type: string}
        scheduledFor: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        status: {type: string}
        providerName: {type: string}
        modelName: {type: string}
        marketReport: {type: string}
        sectorReport: {type: string}
        stockReport: {type: string}
        finalReport: {type: string}
        sourceStatusJson: {type: string}
        modelAttemptLogJson: {type: string}
        failureReason: {type: string}
        recommendationCount: {type: integer}
    AnalysisRunSummary:
      type: object
      required: [runId, scheduledFor, startedAt, status, recommendationCount, sourceCount, failedSourceCount]
      properties:
        runId: {type: string}
        scheduledFor: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        status: {type: string}
        providerName: {type: string}
        modelName: {type: string}
        recommendationCount: {type: integer}
        failureReason: {type: string}
        sourceCount: {type: integer}
        failedSourceCount: {type: integer}
    Recommendation:
      type: object
      required: [recommendationId, analysisRunId, stockCode, stockName, signalAt, status]
      properties:
        recommendationId: {type: string}
        analysisRunId: {type: string}
        stockCode: {type: string}
        stockName: {type: string}
        signalAt: {type: string, format: date-time}
        aiSummary: {type: string}
        activationCondition: {type: string, description: Legacy pre-1.6.5 activation field; empty for new recommendations.}
        mainRisk: {type: string}
        sourceRefs: {type: string}
        status: {type: string, enum: [buy_pending, pending, active, sell_pending, invalidated, missed_cash, missed_untradable, closed]}
        nextCheckAt: {type: string, format: date-time}
        activatedAt: {type: string, format: date-time, description: Simulated buy time; legacy JSON name retained for compatibility.}
        activationPrice: {type: number, description: Simulated buy execution price; legacy JSON name retained for compatibility.}
        quantity: {type: integer}
        closedAt: {type: string, format: date-time}
        closePrice: {type: number}
        totalFees: {type: number}
        netPnl: {type: number}
        netYieldRate: {type: number}
        buyAmount: {type: number, description: Actual net cash paid for the simulated buy, including buy-side costs.}
        sellAmount: {type: number, description: Actual net cash received from the simulated sell, after sell-side costs.}
        currentAmount: {type: number, description: Open position value at the latest price after estimated sell-side costs.}
        dataPauseSeconds: {type: integer, format: int64}
        reservedCash: {type: number, description: Cash reserved while the recommendation is waiting for its one-shot buy attempt.}
    LifecycleMessage:
      type: object
      properties: {sequence: {type: integer}, role: {type: string}, phase: {type: string}, content: {type: string}, responseId: {type: string}, createdAt: {type: string, format: date-time}}
    DecisionEvent:
      type: object
      properties: {eventId: {type: string}, decisionType: {type: string}, decidedAt: {type: string, format: date-time}, aiResponse: {type: string}, reason: {type: string}, quotePrice: {type: number}, quoteAt: {type: string, format: date-time}, sourceRefs: {type: string}, dataStatus: {type: string}}
    LifecycleObservation:
      type: object
      required: [observationId, recommendationId, phase, windowFrom, observedAt, status, quoteJson, minuteSummaryJson, evidenceJson, sourceStatusJson, modelInvoked]
      properties:
        observationId: {type: string}
        recommendationId: {type: string}
        phase: {type: string}
        windowFrom: {type: string, format: date-time}
        observedAt: {type: string, format: date-time}
        status: {type: string}
        quoteJson: {type: string}
        minuteSummaryJson: {type: string}
        evidenceJson: {type: string}
        sourceStatusJson: {type: string}
        criticalFailure: {type: string}
        contentFingerprint: {type: string}
        modelInvoked: {type: boolean}
    SimulatedTrade:
      type: object
      properties: {side: {type: string}, tradedAt: {type: string, format: date-time}, marketPrice: {type: number}, executionPrice: {type: number}, quantity: {type: integer}, totalFees: {type: number}, netCashFlow: {type: number}}
    Position:
      type: object
      properties: {stockCode: {type: string}, stockName: {type: string}, quantity: {type: integer}, entryAt: {type: string, format: date-time}, entryPrice: {type: number}, buyFees: {type: number}, currentPrice: {type: number}, currentPriceAt: {type: string, format: date-time}, status: {type: string}, sellFees: {type: number}, netPnl: {type: number}, netYieldRate: {type: number}, estimatedSellFees: {type: number}, netSellValue: {type: number}}
    RecommendationDetail:
      type: object
      required: [recommendation, analysis, messages, decisions, observations, trades, activationTradingElapsedSeconds, activationRemainingSeconds]
      properties:
        recommendation: {$ref: "#/components/schemas/Recommendation"}
        analysis: {$ref: "#/components/schemas/AnalysisRun"}
        messages: {type: array, items: {$ref: "#/components/schemas/LifecycleMessage"}}
        decisions: {type: array, items: {$ref: "#/components/schemas/DecisionEvent"}}
        observations: {type: array, items: {$ref: "#/components/schemas/LifecycleObservation"}}
        trades: {type: array, items: {$ref: "#/components/schemas/SimulatedTrade"}}
        position: {$ref: "#/components/schemas/Position"}
        activationTradingElapsedSeconds: {type: integer, format: int64}
        activationRemainingSeconds: {type: integer, format: int64}
    RecommendationChartBar:
      type: object
      required: [at, open, high, low, close, volume, amount, source, netPnl, netYieldRate]
      properties:
        at: {type: string, format: date-time}
        open: {type: number}
        high: {type: number}
        low: {type: number}
        close: {type: number}
        volume: {type: number}
        amount: {type: number}
        source: {type: string}
        netPnl: {type: number, description: Full-cost estimated net profit at this minute.}
        netYieldRate: {type: number, description: Full-cost estimated net yield at this minute.}
    RecommendationChartTrade:
      type: object
      required: [side, tradedAt, marketPrice, executionPrice, quantity, totalFees, netCashFlow, markerSnapped]
      properties:
        side: {type: string, enum: [buy, sell]}
        tradedAt: {type: string, format: date-time}
        marketPrice: {type: number}
        executionPrice: {type: number}
        quantity: {type: integer, format: int64}
        totalFees: {type: number}
        netCashFlow: {type: number}
        markerAt: {type: string, format: date-time, description: Nearest bar in the same trading segment within five minutes; omitted if unavailable.}
        markerSnapped: {type: boolean}
    RecommendationChartSession:
      type: object
      required: [date, previousClose, status]
      properties:
        date: {type: string, format: date}
        previousClose: {type: number}
        status: {type: string, enum: [complete, partial, missing]}
    ChartProviderError:
      type: object
      required: [provider, message]
      properties:
        provider: {type: string}
        message: {type: string}
    RecommendationChart:
      type: object
      required: [recommendationId, stockCode, stockName, status, rangeFrom, rangeTo, refreshedAt, currentPrice, currentNetPnl, currentNetYieldRate, missingSessions, providerErrors, sessions, bars, trades]
      properties:
        recommendationId: {type: string}
        stockCode: {type: string}
        stockName: {type: string}
        status: {type: string, enum: [complete, partial, empty]}
        rangeFrom: {type: string, format: date-time}
        rangeTo: {type: string, format: date-time}
        refreshedAt: {type: string, format: date-time}
        quoteAt: {type: string, format: date-time}
        currentPrice: {type: number}
        currentNetPnl: {type: number}
        currentNetYieldRate: {type: number}
        missingSessions: {type: array, items: {type: string, format: date}}
        providerErrors: {type: array, items: {$ref: "#/components/schemas/ChartProviderError"}}
        sessions: {type: array, items: {$ref: "#/components/schemas/RecommendationChartSession"}}
        bars: {type: array, items: {$ref: "#/components/schemas/RecommendationChartBar"}}
        trades: {type: array, items: {$ref: "#/components/schemas/RecommendationChartTrade"}}
    AccountOverview:
      type: object
      required: [initialCash, cash, positionValue, netAssetValue, cumulativeNetContribution, currentPositions, pendingBuys, netProfit, netYieldRate, timeWeightedReturn, cumulativeCapitalReturn, valuedAt, positions]
      properties:
        initialCash: {type: number}
        cash: {type: number}
        positionValue: {type: number}
        netAssetValue: {type: number}
        cumulativeNetContribution: {type: number}
        currentPositions: {type: integer}
        pendingBuys: {type: integer}
        netProfit: {type: number}
        netYieldRate: {type: number, description: Compatibility alias of timeWeightedReturn.}
        timeWeightedReturn: {type: number, description: Unitized time-weighted return excluding external contributions.}
        cumulativeCapitalReturn: {type: number, description: Net profit divided by cumulative net contribution.}
        valuedAt: {type: string, format: date-time}
        positions: {type: array, items: {$ref: "#/components/schemas/Position"}}
    AccountCashFlow:
      type: object
      required: [flowId, sequence, type, amount, effectiveAt, tradingDate, netAssetValueBefore, netAssetValueAfter, unitValueBefore, unitsIssued, createdAt]
      properties:
        flowId: {type: string}
        sequence: {type: integer}
        type: {type: string, enum: [initial_deposit, scheduled_deposit]}
        amount: {type: number}
        effectiveAt: {type: string, format: date-time}
        tradingDate: {type: string, format: date}
        netAssetValueBefore: {type: number}
        netAssetValueAfter: {type: number}
        unitValueBefore: {type: number}
        unitsIssued: {type: number}
        createdAt: {type: string, format: date-time}
    AccountPerformancePoint:
      type: object
      required: [valuedAt, tradingDate, snapshotType, cash, positionValue, netAssetValue, cumulativeNetContribution, unitValue, timeWeightedReturn, valuationStatus]
      properties:
        valuedAt: {type: string, format: date-time}
        tradingDate: {type: string, format: date}
        snapshotType: {type: string, enum: [initial_deposit, pre_deposit, post_deposit, daily_close, current]}
        cash: {type: number}
        positionValue: {type: number}
        netAssetValue: {type: number}
        cumulativeNetContribution: {type: number}
        unitValue: {type: number}
        timeWeightedReturn: {type: number}
        valuationStatus: {type: string}
    StrategyPerformanceMetrics:
      type: object
      required: [closedTrades, winRate, averageGainRate, averageLossRate, payoffRatio, maxDrawdown, totalFees, turnoverRate, capitalUtilization, averageHoldingMinutes, missedExecutionRate, industryConcentration, industryConcentrationStatus, sampleLevel]
      properties:
        closedTrades: {type: integer}
        winRate: {type: number}
        averageGainRate: {type: number}
        averageLossRate: {type: number}
        payoffRatio: {type: number}
        maxDrawdown: {type: number}
        totalFees: {type: number}
        turnoverRate: {type: number}
        capitalUtilization: {type: number}
        averageHoldingMinutes: {type: number}
        missedExecutionRate: {type: number}
        industryConcentration: {type: number, nullable: true}
        industryConcentrationStatus: {type: string, enum: [available, unavailable_no_structured_industry_data]}
        sampleLevel: {type: string, enum: [样本不足, 初步观察, 可进行阶段性评价]}
    AccountPerformance:
      type: object
      required: [valuedAt, unitValue, timeWeightedReturn, cumulativeCapitalReturn, netProfit, netAssetValue, cumulativeNetContribution, curve, metrics]
      properties:
        valuedAt: {type: string, format: date-time}
        unitValue: {type: number}
        timeWeightedReturn: {type: number}
        cumulativeCapitalReturn: {type: number}
        netProfit: {type: number}
        netAssetValue: {type: number}
        cumulativeNetContribution: {type: number}
        curve: {type: array, items: {$ref: "#/components/schemas/AccountPerformancePoint"}}
        metrics: {$ref: "#/components/schemas/StrategyPerformanceMetrics"}
